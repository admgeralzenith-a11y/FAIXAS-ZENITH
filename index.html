<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faixas – Zênith Judô</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#d71920;--red2:#a80f16;--ink:#141414;--cream:#f7f1e8;--card:#fffdf9;--mute:#76706a}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--cream);
}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.hero{position:relative;background:var(--red);border-radius:26px;padding:22px 18px 18px 24px;color:#fff;overflow:hidden;
 display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;
 background-image:repeating-conic-gradient(from 0deg at 82% 45%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 18deg)}
.left{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding-bottom:8px}
.tag{align-self:flex-start;background:var(--ink);color:#fff;font-family:Anton,sans-serif;letter-spacing:.06em;font-size:14px;padding:6px 12px;border-radius:8px}
h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(38px,7vw,62px);line-height:.98;margin:0;text-transform:uppercase}
h1 span{color:var(--ink);background:#fff;padding:0 8px;border-radius:6px;display:inline-block;margin-top:6px}
.mascot{display:block;height:370px;width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));transform-origin:bottom center;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg) translateY(-3px)}}
.bubble{position:relative;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:14px 16px;font-weight:800;font-size:18px;line-height:1.35;box-shadow:5px 5px 0 var(--ink);margin-right:14px}
.bubble::after{content:"";position:absolute;right:-22px;top:22px;border:12px solid transparent;border-left:18px solid var(--ink)}
.bubble::before{content:"";position:absolute;right:-14px;top:25px;border:9px solid transparent;border-left:14px solid #fff;z-index:1}
.bubble .hi{color:var(--red)}
.bubble small{display:block;margin-top:8px;font-size:15px;font-weight:900;color:var(--red);animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.bubble small{animation:none}}
.ok{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:10px 12px;border:2px dashed #e2d3c2;border-radius:14px;cursor:pointer;font-weight:800;font-size:14px;line-height:1.3;user-select:none}
.ok input{appearance:none;flex:none;width:26px;height:26px;border:3px solid var(--ink);border-radius:8px;background:#fff;display:grid;place-items:center;cursor:pointer;margin:0}
.ok input:checked{background:#1f9d4c;border-color:#1f9d4c}
.ok input:checked::after{content:"✔";color:#fff;font-size:16px;font-weight:900}
.row.done{border-color:#1f9d4c;background:#f1fbf4}
.row.done .ok{border-style:solid;border-color:#1f9d4c;color:#137a39}
.wa{display:none;margin-top:10px;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:900;padding:11px 14px;border-radius:12px;font-size:15px}
.row.done .wa{display:flex}
.ok.alt input:checked{background:var(--red);border-color:var(--red)}
.row.change{border-color:var(--red);background:#fff4f3}
.row.change .ok.alt{border-style:solid;border-color:var(--red);color:var(--red)}
.obs{display:none;margin-top:10px}
.row.change .obs{display:block}
.obs textarea{width:100%;min-height:80px;font:inherit;font-weight:700;font-size:15px;padding:10px 12px;border:2px solid var(--red);border-radius:12px;resize:vertical;background:#fff;color:var(--ink)}
.row.change .wa{display:flex}
.search{position:sticky;top:10px;z-index:10;margin:22px 0 16px;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 8px 6px 16px;box-shadow:5px 5px 0 var(--red)}
.search svg{flex:none}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:19px;font-weight:800;padding:12px 0;background:transparent;color:var(--ink);min-width:0}
.search input::placeholder{color:#b3aca4}
.clear{border:0;background:var(--cream);font:inherit;font-weight:900;border-radius:12px;padding:10px 14px;cursor:pointer;display:none}
.count{font-weight:800;color:var(--mute);font-size:14px;margin:0 4px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--card);border:2px solid #eadfd2;border-radius:18px;padding:12px 14px;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.letter{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;font-family:Anton,sans-serif;font-size:22px;display:grid;place-items:center}
.nm{font-weight:900;font-size:16px;line-height:1.2}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);font-weight:700;margin:4px 0 9px}
.info b{color:var(--ink)}
.belt{position:relative;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;max-width:420px;
 box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.3);border:1.5px solid rgba(0,0,0,.25);overflow:hidden}
.belt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(0,0,0,.06) 5px 6px);pointer-events:none}
.belt .tip{position:absolute;top:0;bottom:0;width:20%}.belt .l{left:0}.belt .r{right:0}
.belt .label{position:relative;font-weight:900;font-size:13px;letter-spacing:.08em;font-family:Nunito,sans-serif}
.empty{text-align:center;padding:30px 10px;font-weight:800;color:var(--mute)}
footer{text-align:center;margin-top:34px;font-family:Anton,sans-serif;letter-spacing:.08em;color:var(--red);font-size:15px}
mark{background:#ffe08a;border-radius:3px;padding:0 1px}
@media (max-width:600px){
 .hero{padding:18px 8px 14px 16px;border-radius:22px}
 h1{font-size:34px}
 .mascot{height:250px}
 .bubble{font-size:15px;padding:12px;margin-right:10px}
 .bubble small{font-size:13px}
}
@media (max-width:380px){.mascot{height:220px}h1{font-size:30px}.bubble{font-size:14px}}
</style></head><body><div class="wrap">

 return s.s==='alt'?`✏️ Quero alterar a faixa de ${r.full}:\n${base}\n\nObservação: ${(s.obs||'').trim()||'(sem observação)'}`
 :`✅ Confirmo que conferi a faixa de ${r.full}:\n${base}\nEstá tudo certo, concordo! 🥋`};
const waLink=r=>`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg(r))}`;
function render(){const t=norm(q.value.trim());
 const rs=rows.filter(r=>!t||norm(r.full+' '+r.tag).includes(t));
 clr.style.display=t?'block':'none';
 rs.forEach(r=>byKey[r.full]=r);
 list.innerHTML=rs.map(r=>{const s=st[r.full]||{};return `<div class="row${s.s==='ok'?' done':s.s==='alt'?' change':''}" data-k="${esc(r.full)}"><div class="letter">${r.full[0]}</div><div><div class="nm">${hl(r.full,t)}</div>
 <div class="info"><span>Faixa: <b>${nice(r.g)}</b></span><span>Tamanho: <b>${r.size}</b></span></div>${belt(r.g,esc(r.tag))}</div></div>`}).join('')
 ||'<div class="empty">Nenhum nome encontrado. Tente só o primeiro nome 😉</div>';
 count.textContent=t?`${rs.length} resultado${rs.length===1?'':'s'}`:`${rs.length} alunos em ordem alfabética`;
 if(!t)bubble.innerHTML=START;
 else if(rs.length===1)bubble.innerHTML=`Achei! 🎉 A faixa de <span class="hi">${esc(rs[0].full.split(' ')[0])}</span> é <span class="hi">${nice(rs[0].g).toLowerCase()}</span>, tamanho ${rs[0].size}. Oss! 🥋<small>⚠️ Não esqueça de conferir o nome na faixa e a cor!</small>`;
 else if(rs.length)bubble.innerHTML=`Encontrei <span class="hi">${rs.length} judocas</span> com esse nome! Confere aí embaixo 👇<small>⚠️ Não esqueça de conferir o nome na faixa e a cor!</small>`;
 else bubble.innerHTML=`Hmm… 🤔 Não achei esse nome. <span class="hi">Tenta de outro jeito</span>, só o primeiro nome por exemplo!`}
q.oninput=render;clr.onclick=()=>{q.value='';render();q.focus()};render();
</script></body></html>
